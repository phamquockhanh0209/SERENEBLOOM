<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khôi Phục Mật Khẩu — SereneBloom</title>
  <meta name="description" content="Khôi phục mật khẩu tài khoản SereneBloom qua email.">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.png">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand-icon">
        <img src="assets/images/logo.png" alt="SereneBloom" width="36" height="36">
      </div>
      <h1>Khôi phục mật khẩu 🔑</h1>
      <p>Nhập email đăng ký của bạn. Chúng mình sẽ gửi liên kết để bạn đặt lại mật khẩu an toàn.</p>
    </div>

    <!-- Success Feedback Box -->
    <div id="forgot-success-box" style="display: none; background: #EAF6EE; border: 1.5px solid var(--color-success); border-radius: var(--radius-md); padding: 1.25rem; text-align: center; color: var(--color-success); margin-bottom: 1.5rem;">
      <h3 style="margin-bottom: 0.35rem;">Đã gửi liên kết thành công!</h3>
      <p style="font-size: var(--font-size-xs); color: var(--color-text-main); margin-bottom: 1rem;">
        Vui lòng kiểm tra hộp thư đến (hoặc hòm thư Spam) và làm theo hướng dẫn để tạo mật khẩu mới.
      </p>
      <a href="login.html" class="btn btn-primary btn-sm">Quay về trang đăng nhập</a>
    </div>

    <form class="auth-form" id="forgot-form">
      <div class="form-group">
        <label for="forgot-email" class="form-label">Email tài khoản</label>
        <div class="form-input-wrap">
          <input 
            type="email" 
            id="forgot-email" 
            placeholder="tenban@thpt.edu.vn" 
            required 
            autocomplete="email">
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="forgot-submit-btn" style="width: 100%; margin-top: 0.5rem;">
        Gửi liên kết khôi phục
      </button>
    </form>

    <div class="auth-footer">
      <span>Nhớ lại mật khẩu rồi? </span>
      <a href="login.html" style="font-weight: 600; color: var(--color-sage-dark);">Đăng nhập &rarr;</a>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- ES Modules -->
  <script type="module">
    import { initAuthPage } from './js/auth.js';
    document.addEventListener('DOMContentLoaded', initAuthPage);
  </script>
</body>
</html>
